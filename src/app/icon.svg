<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    S-OS favicon.

    A standalone file cannot read the design tokens, so the brand colours are
    literal here. This is the one sanctioned exception to the no-hardcoded-hex
    rule; if the accent ramp changes, this file changes with it.
  -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#8EF1FF" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#1A86D6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0C4373" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="20" fill="#1A86D6"/>
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#sheen)" opacity="0.55"/>
  <rect x="7" y="7" width="86" height="86" rx="19" fill="none" stroke="#8EF1FF" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M66 36 C 62 25, 36 24, 35 37 C 34 50, 65 47, 64 60 C 63 73, 38 74, 33 65"
        fill="none" stroke="#E4FAFF" stroke-width="9" stroke-linecap="round"/>
</svg>
